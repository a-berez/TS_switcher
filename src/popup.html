<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS_switcher</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="popup-themes.css">
    <link rel="stylesheet" href="theme-overrides.css">
    <link rel="stylesheet" href="popup.css">
    <script src="sites.js"></script>
    <script src="theme.js"></script>
    <script src="popup-theme.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>TS_switcher</h2>
            <button type="button" id="open-options" class="header-link" title="Настройки">⚙</button>
        </div>

        <div id="fallback-banner" class="fallback-banner hidden"></div>

        <div class="status" id="status">
            <div class="status-indicator"></div>
            <span id="current-site">Загрузка...</span>
        </div>

        <div class="toolbar">
            <label for="preferred-select" class="toolbar-label">Предпочитаемый TS:</label>
            <select id="preferred-select" class="toolbar-select"></select>
        </div>

        <div class="controls">
            <div id="switch-ts-section" class="control-section hidden">
                <h3>Турнирный сайт и зеркала</h3>
                <div id="switch-ts-buttons"></div>
            </div>
            <div id="switch-rating-section" class="control-section hidden">
                <h3>Рейтинги</h3>
                <div id="switch-rating-buttons"></div>
            </div>
        </div>

        <div id="copy-section" class="footer hidden">
            <h3 class="copy-heading">Копировать ссылку</h3>
            <div id="copy-buttons" class="copy-grid">
                <div id="copy-ts-row" class="copy-row hidden"></div>
                <div id="copy-rating-row" class="copy-row hidden"></div>
            </div>
            <div id="copy-message" class="copy-message hidden">Ссылка скопирована!</div>
        </div>
    </div>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
